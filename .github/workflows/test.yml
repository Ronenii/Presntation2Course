name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --user -r requirements-dev.txt

      - name: Run tests
        # Both test_real_chromium_produces_a_pdf and its normalize()-side sibling
        # test_real_chromium_renders_markdown_to_a_readable_pdf hang to their own
        # 180s timeout on this runner: Chromium is installed, so neither is
        # skipped, but headless Chromium needs a D-Bus session this container
        # doesn't provide. Not a bug in the project -- excluded here, still runs
        # locally/manually where a full desktop environment is available.
        run: >
          python3 -m pytest
          --deselect tests/test_export_pdf.py::test_real_chromium_produces_a_pdf
          --deselect tests/test_normalize.py::test_real_chromium_renders_markdown_to_a_readable_pdf
