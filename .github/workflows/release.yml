name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like vX.Y.Z, got '${{ inputs.version }}'"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Build release archive
        run: |
          staging="presentation2course-${{ inputs.version }}"
          mkdir -p "$staging/presentation2course"
          cp -r SKILL.md references assets scripts requirements.txt "$staging/presentation2course/"
          cp -r .claude/skills/animejs "$staging/animejs"
          # Tar the staging dir's *contents*, not the dir itself: the README's Quick
          # Start says to extract straight into .claude/skills/, giving two sibling
          # skill dirs (presentation2course/, animejs/) -- so the archive must not
          # add its own wrapper directory on top of that.
          tar -czf "${staging}.tar.gz" -C "$staging" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: presentation2course-${{ inputs.version }}.tar.gz
          generate_release_notes: true
